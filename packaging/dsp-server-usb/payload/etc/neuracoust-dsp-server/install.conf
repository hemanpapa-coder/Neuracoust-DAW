# Neuracoust DSP Server appliance install configuration.

# Auto-copy the running USB appliance to the internal SSD/NVMe drive.
AUTO_INSTALL_TO_INTERNAL_SSD=1

# Set to 1 after a successful internal install. Firstboot uses this to avoid
# reinstalling when the machine later boots from the internal SSD.
INSTALLED_TO_INTERNAL_SSD=0

# Destructive disk operations require this exact value in the environment.
REQUIRED_ERASE_CONFIRMATION=ERASE

# Preferred target transports. The installer also rejects removable disks and
# the disk that currently hosts the root filesystem.
TARGET_TRANSPORTS="nvme sata ata scsi"

# The installed hostname is suffixed with a short machine id when possible.
HOSTNAME_PREFIX=neuracoust-dsp

