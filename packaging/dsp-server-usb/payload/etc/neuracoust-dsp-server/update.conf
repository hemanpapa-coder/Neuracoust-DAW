# Neuracoust DSP Server firmware/runtime update configuration.

UPDATE_CHANNEL=stable

# This can be license-agent, daw, standalone-updater, local-usb, or
# self-scheduled. The value is reported in update-status logs so the fleet can
# later tell which surface initiated the update.
UPDATE_CONTROLLER=self-scheduled

# Internal development server channel. Public production mirrors can replace
# this URL after the release API is wired.
UPDATE_MANIFEST_URL=http://192.168.0.190:3000/api/neuracoust-dsp-server/firmware/stable/latest.json

CURRENT_VERSION_FILE=/etc/neuracoust-dsp-server/version
UPDATE_STATE_DIR=/var/lib/neuracoust/dsp-server/update
UPDATE_LOG_DIR=/var/log/neuracoust/dsp-server

# Set to 1 when an image should auto-apply a newer stable package during its
# scheduled maintenance window.
AUTO_APPLY_UPDATES=0
