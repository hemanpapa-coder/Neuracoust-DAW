# Neuracoust NDS appliance — Debian 12 fully unattended install.
#
# Loaded twice on purpose: once from inside the installer initrd (/preseed.cfg, read before
# anything can ask a question) and once from the medium (/cdrom/nds/preseed.cfg, the fallback
# if the initrd was not rebuilt). Same file, so loading it twice changes nothing.
#
# Every question the Debian installer can ask has to be answered here. One unanswered
# question and the machine sits at a prompt forever with nobody in the room — which is the
# whole thing this file exists to prevent.

### Language, keyboard, clock — asked before anything else
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string KR
d-i localechooser/supported-locales multiselect en_US.UTF-8, ko_KR.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i console-setup/ask_detect boolean false

d-i clock-setup/utc boolean true
d-i time/zone string Asia/Seoul
d-i clock-setup/ntp boolean true

### Network
# choose_interface auto = the first interface with a carrier, so a machine with two NICs does
# not ask which one. link_wait_timeout covers a switch that is still negotiating at boot.
d-i netcfg/choose_interface select auto
d-i netcfg/link_wait_timeout string 30
d-i netcfg/dhcp_timeout string 60
d-i netcfg/dhcpv6_timeout string 60
# A DHCP failure normally opens a menu (retry / static / no network). Answer it: retry once
# more, and if there is still no lease do not ask — the late_command below leaves the box in a
# state where link-local still works.
d-i netcfg/dhcp_failed note
d-i netcfg/dhcp_options select Retry network autoconfiguration
d-i netcfg/get_hostname string nds
d-i netcfg/hostname string nds
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string
# Some non-free wireless firmware prompts even on a wired install
d-i hw-detect/load_firmware boolean true

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
# No suite pin: whichever Debian the downloaded installer belongs to is the one it installs.
# Pinning it here is how a remastered ISO ends up trying to install the previous release.

### Accounts
# No root password: the first user gets sudo, which is what the management flow needs. The
# password is a formality — every real login is by the key installed in late_command.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Neuracoust DSP
d-i passwd/username string heinhome
d-i passwd/user-password password neuracoust
d-i passwd/user-password-again password neuracoust
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false
d-i passwd/user-default-groups string audio cdrom dip floppy video plugdev netdev sudo

### Partitioning
# The disk is picked in early_command, not here: the USB the installer booted from is also a
# disk, and an unset partman-auto/disk on a machine with more than one drive is an interactive
# question. Everything else is a confirmation that would otherwise stop and wait.
d-i partman/early_command string \
    TARGET=""; \
    for DEV in $(list-devices disk); do \
        BASE=$(basename $DEV); \
        [ "$(cat /sys/block/$BASE/removable 2>/dev/null)" = "1" ] && continue; \
        TARGET="$DEV"; break; \
    done; \
    [ -n "$TARGET" ] || TARGET=$(list-devices disk | head -n1); \
    debconf-set partman-auto/disk "$TARGET"; \
    debconf-set grub-installer/bootdev "$TARGET"

d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/init_automatically_partition select biggest_free
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true
d-i partman-md/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-basicfilesystems/no_swap boolean false
# A BIOS (CSM) install onto a disk the installer sees as EFI-capable asks to confirm
d-i partman-efi/non_efi_system boolean true

### Kernel — PREEMPT_RT, the whole point of the appliance
d-i base-installer/kernel/image string linux-image-rt-amd64

### apt
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org
d-i apt-setup/cdrom/set-first boolean false

### Packages
# Standard system + ssh only. No desktop: this box has no screen after today.
tasksel tasksel/first multiselect standard, ssh-server
# Everything the node needs to BUILD the engine from source at first boot, so the appliance
# never needs the network again after the install.
d-i pkgsel/include string \
    openssh-server sudo \
    build-essential g++ make \
    avahi-daemon avahi-utils libnss-mdns \
    rsync curl ca-certificates \
    cpufrequtils linux-cpupower \
    htop ethtool net-tools iproute2 \
    python3
d-i pkgsel/upgrade select safe-upgrade
d-i pkgsel/update-policy select unattended-upgrades
popularity-contest popularity-contest/participate boolean false

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
# bootdev is set by early_command to the same disk partman used
d-i grub-installer/bootdev string default

### Finish
d-i finish-install/keep-consoles boolean false
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
d-i debian-installer/exit/poweroff boolean false

### Hand the machine over to the first-boot script
# Runs OUTSIDE the target for file copies (/target is a plain directory here) and in-target
# only for commands that must run in the installed system.
d-i preseed/late_command string \
    cp -r /cdrom/nds /target/opt/nds-install; \
    chmod +x /target/opt/nds-install/firstboot.sh; \
    cp /cdrom/nds/nds-firstboot.service /target/etc/systemd/system/nds-firstboot.service; \
    mkdir -p /target/home/heinhome/.ssh; \
    cp /cdrom/nds/authorized_keys /target/home/heinhome/.ssh/authorized_keys; \
    chmod 700 /target/home/heinhome/.ssh; \
    chmod 600 /target/home/heinhome/.ssh/authorized_keys; \
    in-target chown -R heinhome:heinhome /home/heinhome/.ssh; \
    in-target systemctl enable ssh; \
    in-target systemctl enable nds-firstboot.service
